# Reference build-and-deploy pipeline. Manual trigger only; requires repository secrets
# (AZURE_CREDENTIALS) and the ACR/AKS names below. Shown to document the delivery flow.
name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

env:
  ACR_NAME: acrerpplatdev
  RESOURCE_GROUP: rg-erpplat-dev
  AKS_CLUSTER: aks-erpplat-dev
  APP_REPO: kratos0722/erp-integration-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          path: app

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "erp-integration-service:${{ inputs.image_tag }}" \
            --file docker/Dockerfile \
            app

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER"

      - name: Helm deploy
        run: |
          helm upgrade --install erp-api charts/erp-api \
            --set image.repository="$ACR_NAME.azurecr.io/erp-integration-service" \
            --set image.tag="${{ inputs.image_tag }}" \
            --wait
