replicaCount: 2

image:
  repository: acrerpplatdev.azurecr.io/erp-integration-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: erp-api.example.com

probes:
  path: /swagger/index.html

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080

# DB connection string is injected from a Secret (never commit a real value).
secret:
  connectionString: "Host=psql-erpplat-dev.postgres.database.azure.com;Database=erp;Username=pgadmin;Password=change-me"
